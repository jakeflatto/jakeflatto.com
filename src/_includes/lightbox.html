<div id="image-lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Enlarged image preview">
  <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close image preview">&times;</button>
  <figure class="lightbox-figure">
    <img id="lightbox-img" src="" alt="" />
    <figcaption id="lightbox-caption" class="lightbox-caption"></figcaption>
  </figure>
</div>

<script>
  (function () {
    const lightbox = document.getElementById("image-lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const closeBtn = document.getElementById("lightbox-close");

    function openLightbox(img) {
      lightboxImg.src = img.currentSrc || img.src;
      lightboxImg.alt = img.alt || "";
      lightboxCaption.textContent = img.alt || "";
      lightboxCaption.style.display = img.alt ? "block" : "none";
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
      document.body.style.overflow = "";
    }

    document.addEventListener("click", function (e) {
      if (e.target.matches("img.zoomable")) {
        openLightbox(e.target);
      } else if (e.target === lightbox || e.target === closeBtn) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
      }
    });
  })();
</script>
