<nav class="site-nav" aria-label="Primary Navigation">
  <div class="nav-bar">
    {% unless page.url == "/" or page.url == "/index.html" %}
      <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
    {% endunless %}

    <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-drawer" aria-label="Toggle navigation menu">
      <svg class="icon-hamburger" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
      <svg class="icon-close" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <ul id="nav-drawer" class="nav-drawer">
    {% for item in site.data.nav %}
      <li>
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>

<script>
  (function () {
    const toggle = document.getElementById("nav-toggle");
    const drawer = document.getElementById("nav-drawer");

    function closeMenu() {
      toggle.setAttribute("aria-expanded", "false");
      drawer.classList.remove("open");
    }

    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      const isOpen = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!isOpen));
      drawer.classList.toggle("open", !isOpen);
    });

    document.addEventListener("click", function (e) {
      if (!drawer.contains(e.target) && !toggle.contains(e.target)) {
        closeMenu();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeMenu();
    });
  })();
</script>
